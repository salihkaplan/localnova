name: Bug report
description: Report a bug or a feature that is not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, make sure the issue has not already been reported.
        Never include API keys, passwords, tokens, or other sensitive information.

  - type: input
    id: version
    attributes:
      label: NOVA version
      description: Which version are you using?
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11"
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: Hardware specifications
      description: Include CPU, GPU, RAM, and VRAM if known.
      placeholder: "CPU, GPU, RAM..."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Describe the problem
      description: What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start NOVA
        2. Try the affected feature
        3. Observe the error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error messages or diagnostic logs
      description: Remove secrets and personal information before posting.
      render: text
    validations:
      required: false
